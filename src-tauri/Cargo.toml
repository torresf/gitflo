[package]
name = "gitflo"
version = "0.1.0"
description = "Multi-repo git branch and commit viewer"
authors = ["torresf"]
license = "MIT"
repository = "https://github.com/torresf/gitflo"
edition = "2021"

[lib]
name = "gitflo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
